##
# Lumen — Nginx reverse proxy konfiguráció
# Elhelyezés: /etc/nginx/sites-available/lumen  (symlink: sites-enabled/lumen)
#
# Cseréld ki:
#   YOUR_DOMAIN  →  pl. foto.pelda.hu
#   LETS_ENCRYPT_CERT / KEY  →  certbot által generált útvonalak
##

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Biztonság
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Feltöltési méretlimit (Next.js API route)
    client_max_body_size 500M;

    # Timeout a nagy fájlok feltöltéséhez
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout  30s;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Next.js statikus fájlok cache-elése
        proxy_cache_bypass $http_upgrade;
    }

    # Statikus Next.js fájlok hosszú cache
    location /_next/static/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
